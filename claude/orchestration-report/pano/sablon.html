<!-- Pano: Claude Code geçmiş panosu. Veri sözleşmesi pano/SEMA.md; bu dosya pano.mjs tarafından doldurulur. -->
<style>
/* ==========================================================================
   Pano tasarım sistemi (Faz B1)
   Düzen: üstte marka şeridi, kayan "hap" göstergeli sekmeler, yapışkan tek satır filtre;
   içerik 12 sütunlu kart ızgarası. Kimlik: "bağlam penceresi" motifi.
   Jetonlar (token) tek yerde; koyu tema aynı rampalardan seçilmiş basamaklar (otomatik ters çevirme değil).
   Kategorik sıra (--s1..--s8) dataviz doğrulayıcısından geçti: açık #fcfcfb, koyu #17181b yüzeyde.
   ========================================================================== */
:root {
  /* yüzeyler */
  --zemin: #f1f2f4;            /* sayfa düzlemi */
  --yuzey: #fcfcfb;            /* kart / grafik yüzeyi */
  --yuzey-2: #f3f4f5;          /* gömme alan, seçim izi */
  --yuzey-3: #e6e8eb;          /* ölçer izi, boş hücre */
  --yuzey-cam: rgba(252, 252, 251, .78);
  --cizgi: rgba(11, 11, 11, .09);      /* kıl çizgi kenar */
  --cizgi-guclu: rgba(11, 11, 11, .16);
  --izgara: #e6e5df;           /* grafik ızgarası */
  --eksen: #c3c2b7;            /* taban çizgisi */
  /* mürekkep */
  --metin: #0b0b0b;
  --metin-2: #52514e;
  --metin-3: #6b6963;          /* küçük metinde ≥ 4,5:1 */
  /* vurgu */
  --vurgu: #2a78d6;
  --vurgu-zemin: rgba(42, 120, 214, .10);
  --vurgu-metin: #1c5cab;
  /* kategorik (sabit sıra, döngü yok) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --diger: #a3a29c;
  /* durum (yalnız anlam taşıyınca; simge + etiketle) */
  --iyi: #0ca30c; --uyari: #fab219; --ciddi: #ec835a; --kritik: #d03b3b;
  --iyi-metin: #006300; --kritik-metin: #b42f2f; --uyari-metin: #8a5a00;
  --ipucu-zemin: rgba(252, 252, 251, .97);
  /* derinlik */
  --golge: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .04);
  --golge-2: 0 2px 6px -2px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .05);
  --golge-kalk: 0 18px 36px -16px rgba(16, 24, 40, .24), 0 3px 8px rgba(16, 24, 40, .06);
  --isik: inset 0 1px 0 rgba(255, 255, 255, .7);   /* kartın üst kenar ışığı */
  --au1: rgba(42, 120, 214, .20); --au2: rgba(27, 175, 122, .14); --au3: rgba(235, 104, 52, .09);
  /* tipografi */
  --yazi: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --kod: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --t-xs: 11px; --t-s: 12.5px; --t-m: 14px; --t-l: 16px; --t-xl: 22px; --t-xxl: 26px;
  /* yarıçap ve aralık */
  --r-s: 7px; --r-m: 10px; --yaricap: 16px; --r-hap: 999px;
  --a1: 4px; --a2: 8px; --a3: 12px; --a4: 16px; --a5: 24px; --a6: 32px;
  /* hareket */
  --yay: cubic-bezier(.3, 1.35, .5, 1);
  --egri: cubic-bezier(.2, .75, .25, 1);
  --hizli: .16s; --orta: .32s;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #0b0c0e; --yuzey: #17181b; --yuzey-2: #1f2124; --yuzey-3: #2a2c30; --yuzey-cam: rgba(23, 24, 27, .78);
    --cizgi: rgba(255, 255, 255, .08); --cizgi-guclu: rgba(255, 255, 255, .15); --izgara: #26272a; --eksen: #3e3e3b;
    --metin: #f3f2ef; --metin-2: #c3c2b7; --metin-3: #9a988f;
    --vurgu: #3987e5; --vurgu-zemin: rgba(57, 135, 229, .16); --vurgu-metin: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --diger: #6b6a65; --iyi-metin: #0ca30c; --kritik-metin: #e66767; --uyari-metin: #fab219;
    --ipucu-zemin: rgba(28, 29, 32, .97);
    --golge: 0 1px 2px rgba(0, 0, 0, .35); --golge-2: 0 2px 8px -2px rgba(0, 0, 0, .5);
    --golge-kalk: 0 20px 40px -16px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .35);
    --isik: inset 0 1px 0 rgba(255, 255, 255, .04);
    --au1: rgba(57, 135, 229, .17); --au2: rgba(25, 158, 112, .11); --au3: rgba(217, 89, 38, .08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --zemin: #0b0c0e; --yuzey: #17181b; --yuzey-2: #1f2124; --yuzey-3: #2a2c30; --yuzey-cam: rgba(23, 24, 27, .78);
  --cizgi: rgba(255, 255, 255, .08); --cizgi-guclu: rgba(255, 255, 255, .15); --izgara: #26272a; --eksen: #3e3e3b;
  --metin: #f3f2ef; --metin-2: #c3c2b7; --metin-3: #9a988f;
  --vurgu: #3987e5; --vurgu-zemin: rgba(57, 135, 229, .16); --vurgu-metin: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --diger: #6b6a65; --iyi-metin: #0ca30c; --kritik-metin: #e66767; --uyari-metin: #fab219;
  --ipucu-zemin: rgba(28, 29, 32, .97);
  --golge: 0 1px 2px rgba(0, 0, 0, .35); --golge-2: 0 2px 8px -2px rgba(0, 0, 0, .5);
  --golge-kalk: 0 20px 40px -16px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .35);
  --isik: inset 0 1px 0 rgba(255, 255, 255, .04);
  --au1: rgba(57, 135, 229, .17); --au2: rgba(25, 158, 112, .11); --au3: rgba(217, 89, 38, .08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* Güvenli alan boşluğu kökte: Artifact iskeleti de :root'a aynı dolguyu verir, böylece toplanmaz. */
:root { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--zemin); color: var(--metin);
  font: var(--t-m)/1.5 var(--yazi);
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 650; text-wrap: balance; letter-spacing: -.012em; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; border-radius: 6px; }
code, .kod { font-family: var(--kod); font-size: .92em; }
.gizli-metin { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sayi { font-variant-numeric: tabular-nums; }
::selection { background: var(--vurgu-zemin); }

/* Arka plan aurorası: yalnız transform animasyonu (bileşik katman), azaltılmış harekette durur */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%; }
.aurora i:nth-child(1) { top: -32vmax; left: -14vmax; background: radial-gradient(closest-side, var(--au1), transparent 72%); animation: au1 36s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { top: -28vmax; right: -24vmax; background: radial-gradient(closest-side, var(--au2), transparent 72%); animation: au2 44s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { top: 34vh; left: 30vw; background: radial-gradient(closest-side, var(--au3), transparent 72%); animation: au3 52s ease-in-out infinite alternate; }
@keyframes au1 { to { transform: translate3d(14vw, 10vh, 0) scale(1.18); } }
@keyframes au2 { to { transform: translate3d(-16vw, 14vh, 0) scale(.9); } }
@keyframes au3 { to { transform: translate3d(-22vw, -18vh, 0) scale(1.25); } }

.kap { width: 100%; max-width: 1360px; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 720px) { .kap { padding-inline: 28px; } }

/* ---------- Üst şerit ---------- */
.ust { padding-block: 20px 10px; }
.ust-ic { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.marka { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--yuzey); border: 1px solid var(--cizgi); box-shadow: var(--golge-2), var(--isik); }
.logo svg { display: block; }
.marka h1 { font-size: var(--t-xl); line-height: 1.1; letter-spacing: -.02em; }
.marka p { color: var(--metin-2); font-size: var(--t-s); margin-top: 3px; }
.ust-sag { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cip { display: inline-flex; align-items: center; gap: 6px; max-width: min(100%, 340px); overflow: hidden; text-overflow: ellipsis; padding: 4px 10px; border-radius: var(--r-hap); background: var(--yuzey); border: 1px solid var(--cizgi); font-size: 12px; color: var(--metin-2); white-space: nowrap; vertical-align: middle; }
.cip b { color: var(--metin); font-weight: 600; }
.cip > i { width: 7px; height: 7px; border-radius: 50%; background: var(--metin-3); display: inline-block; flex: none; }
.dugme { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: var(--r-m); padding: 6px 11px; font-size: var(--t-s); color: var(--metin); box-shadow: var(--golge); transition: background var(--hizli), border-color var(--hizli), transform var(--hizli); }
.dugme:hover { background: var(--yuzey-2); border-color: var(--cizgi-guclu); }
.dugme:active { transform: scale(.97); }
.dugme:disabled { opacity: .55; cursor: default; }
.dugme svg { width: 15px; height: 15px; flex: none; }
.dugme[aria-pressed="true"] { background: var(--vurgu-zemin); border-color: var(--vurgu); color: var(--vurgu-metin); }
.dugme.donuyor svg { animation: don .8s linear infinite; }
@keyframes don { to { transform: rotate(360deg); } }

/* Bağlantı çipi (sunucu modu, canlı SSE) */
.nokta { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--metin-3); flex: none; display: inline-block; }
.nokta::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; opacity: 0; }
.baglanti.canli .nokta { background: var(--iyi); }
.baglanti.canli .nokta::after, .nokta.yanar::after { animation: nabiz-halka 1.8s ease-out infinite; }
.baglanti.baglaniyor .nokta { background: var(--uyari); }
.baglanti.koptu { border-color: color-mix(in srgb, var(--kritik) 45%, transparent); color: var(--kritik-metin); }
.baglanti.koptu .nokta { background: var(--kritik); }
.nokta.yanar { background: var(--iyi); }
@keyframes nabiz-halka { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(2.8); opacity: 0; } }

/* ---------- Sekmeler: kayan hap ---------- */
.sekmeler-kap { position: relative; }
.sekmeler { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 4px; width: fit-content; max-width: 100%; background: var(--yuzey-2); border: 1px solid var(--cizgi); border-radius: 13px; }
.sekmeler::-webkit-scrollbar { display: none; }
.sekme { position: relative; z-index: 1; flex: none; display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 7px 13px; font-size: 13.5px; font-weight: 550; color: var(--metin-2); border-radius: 9px; transition: color var(--hizli); }
.sekme:hover { color: var(--metin); }
.sekme[aria-selected="true"] { color: var(--metin); }
.sekme-cizgi { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 10px; background: var(--yuzey); border-radius: 9px; box-shadow: var(--golge-2), var(--isik); border: 1px solid var(--cizgi); transition: transform .45s var(--yay), width .45s var(--yay); pointer-events: none; }
.sekme .canli-rozet { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--metin-2); }
.sekme .canli-rozet b { min-width: 1ch; font-weight: 650; }

/* ---------- Filtreler ---------- */
.filtre-kap { position: relative; z-index: 20; padding-block: 12px 4px; }
@media (min-width: 900px) {
  .filtre-kap { position: sticky; top: env(safe-area-inset-top, 0px); }
  .filtre-kap.yapisti .filtreler { box-shadow: var(--golge-kalk); background: var(--yuzey-cam); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); }
}
.filtreler { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 14px; padding: 8px 10px; box-shadow: var(--golge); transition: box-shadow var(--orta), background var(--orta); }
.f-grup { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
.f-etiket { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--metin-3); font-weight: 650; }
.secim { display: inline-flex; flex-wrap: wrap; background: var(--yuzey-2); border-radius: var(--r-m); padding: 2px; gap: 2px; border: 1px solid var(--cizgi); }
.secim button { border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; font-size: var(--t-s); color: var(--metin-2); transition: background var(--hizli), color var(--hizli), box-shadow var(--hizli); white-space: nowrap; }
.secim button:hover { color: var(--metin); }
.secim button[aria-pressed="true"] { background: var(--yuzey); color: var(--metin); box-shadow: 0 1px 2px rgba(0, 0, 0, .12), var(--isik); font-weight: 600; }
.f-tarih { display: inline-flex; gap: 6px; align-items: center; }
.f-tarih input, .f-secim, .arama { border: 1px solid var(--cizgi); background: var(--yuzey-2); border-radius: 8px; padding: 4px 8px; font-size: var(--t-s); min-width: 0; }
.f-tarih input { width: 9.6em; }
.f-ozet { margin-left: auto; font-size: 12px; color: var(--metin-3); font-variant-numeric: tabular-nums; }
.f-ac { display: none; }
@media (max-width: 639px) {
  .f-ac { display: inline-flex; }
  .filtreler:not(.acik) > .f-grup { display: none; }
  .filtreler.acik .f-ac { background: var(--vurgu-zemin); }
}
.f-sifirla { border: 0; background: none; color: var(--vurgu-metin); font-size: var(--t-s); padding: 4px 6px; border-radius: 6px; }
.f-sifirla:hover { background: var(--vurgu-zemin); }
.acilir { position: relative; }
.acilir-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; width: min(300px, calc(100vw - 32px)); background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 12px; box-shadow: var(--golge-kalk); padding: 8px; transform-origin: top left; animation: panel-ac .2s ease-out; }
@keyframes panel-ac { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.acilir-panel .liste { max-height: 300px; overflow: auto; margin-top: 6px; display: grid; gap: 1px; }
.acilir-panel label { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 7px; font-size: 13px; cursor: pointer; }
.acilir-panel label:hover { background: var(--yuzey-2); }
.acilir-panel label span:last-child { margin-left: auto; color: var(--metin-3); font-size: 11.5px; }
.acilir-panel .ust-satir { display: flex; gap: 6px; align-items: center; }
.acilir-panel .ust-satir .arama { flex: 1; }

/* ---------- İçerik ızgarası ve kartlar ---------- */
main { padding-block: 8px 44px; min-height: 60vh; transition: opacity var(--orta); }
main.yenileniyor { opacity: .55; }
.bolum { display: none; }
.bolum.aktif { display: block; animation: bolum-gir .38s var(--egri) both; }
@keyframes bolum-gir { from { opacity: 0; transform: translateY(8px); } }
.bolum-bas { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin: 18px 0 16px; }
.bolum-bas h2 { font-size: var(--t-xxl); letter-spacing: -.025em; line-height: 1.15; }
.bolum-bas p { color: var(--metin-2); font-size: 13.5px; max-width: 76ch; margin-top: 4px; }
.izgara { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.izgara > * { grid-column: span 12; min-width: 0; }
@media (min-width: 760px) { .g-6, .g-4, .g-3 { grid-column: span 6 !important; } }
@media (min-width: 760px) and (max-width: 1099px) { .g-o12 { grid-column: span 12 !important; } }
@media (min-width: 1100px) {
  .g-8 { grid-column: span 8 !important; } .g-4 { grid-column: span 4 !important; }
  .g-3 { grid-column: span 3 !important; } .g-5 { grid-column: span 5 !important; } .g-7 { grid-column: span 7 !important; }
}
.kart { position: relative; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--yaricap); padding: 18px 20px 20px; box-shadow: var(--golge), var(--isik); min-width: 0; transition: box-shadow var(--orta), transform .45s var(--yay), border-color var(--orta); }
.kart.kalkar:hover { transform: translateY(-2px); box-shadow: var(--golge-kalk), var(--isik); border-color: var(--cizgi-guclu); }
.gir { animation: gir .6s var(--egri) both; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes gir { from { opacity: 0; transform: translateY(12px) scale(.988); } }
.kart-bas { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 14px; }
.kart-bas h3 { font-size: 15px; letter-spacing: -.01em; }
.kart-bas .alt { font-size: var(--t-s); color: var(--metin-2); margin-top: 2px; max-width: 64ch; }
.kart-arac { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tablo-dugme { border: 1px solid var(--cizgi); background: none; color: var(--metin-3); font-size: 12px; padding: 3px 8px; border-radius: 7px; transition: color var(--hizli), background var(--hizli); }
.tablo-dugme:hover { color: var(--metin); background: var(--yuzey-2); }
.tablo-dugme[aria-pressed="true"] { color: var(--vurgu-metin); border-color: var(--vurgu-zemin); background: var(--vurgu-zemin); }
.grafik { position: relative; min-width: 0; }
.grafik svg { display: block; overflow: visible; max-width: 100%; height: auto; }
.grafik canvas { display: block; }
.bos { color: var(--metin-3); font-size: 13px; padding: 28px 8px; text-align: center; }
.not { font-size: 12px; color: var(--metin-3); margin-top: 10px; }
.lejant { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--metin-2); margin-top: 12px; }
.lejant span { display: inline-flex; align-items: center; gap: 6px; }
.lejant i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.lejant i.cizgi { height: 2px; width: 14px; border-radius: 2px; }
.lejant .olcek { width: 120px; height: 10px; border-radius: 3px; }
.lejant b { color: var(--metin); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- KPI kutuları ---------- */
.kpiler { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .kpiler { grid-template-columns: repeat(var(--y, 4), minmax(0, 1fr)); } }
@media (min-width: 1180px) { .kpiler { grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); } }
.kpi { padding: 14px 16px 0; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.kpi .etiket { font-size: 12px; color: var(--metin-2); font-weight: 550; display: flex; align-items: center; gap: 6px; }
.kpi .etiket i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.kpi .deger { font-size: clamp(22px, 2.4vw, 30px); font-weight: 680; letter-spacing: -.03em; line-height: 1.15; white-space: nowrap; }
.kpi .ek { font-size: 11.5px; color: var(--metin-3); min-height: 1.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi svg.kivilcim { margin: 6px -16px 0; width: calc(100% + 32px); height: 38px; display: block; }
.kpi.kivilcimsiz { padding-bottom: 14px; }
.kpi.vurgulu { background: linear-gradient(160deg, color-mix(in srgb, var(--vurgu) 9%, var(--yuzey)) 0%, var(--yuzey) 70%); }

/* ---------- Gösterge (yarım halka ölçer) ---------- */
.gosterge { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.gosterge svg { width: 100%; max-width: 300px; }
.gosterge .g-alt { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; width: 100%; margin-top: 4px; }
.gosterge .g-alt div { background: var(--yuzey-2); border: 1px solid var(--cizgi); border-radius: var(--r-m); padding: 7px 10px; min-width: 0; }
.gosterge .g-alt b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.gosterge .g-alt span { font-size: 11.5px; color: var(--metin-3); }

/* ---------- Çubuk listesi ---------- */
.cl { display: grid; gap: 4px; }
.cl-satir { display: grid; grid-template-columns: minmax(0, var(--ad-gen, 34%)) minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 8px; transition: background var(--hizli); }
.cl-satir:hover, .cl-satir:focus-visible { background: var(--yuzey-2); }
.cl-satir[data-tik] { cursor: pointer; }
.cl-ad { font-size: var(--t-s); color: var(--metin); overflow-wrap: anywhere; line-height: 1.3; }
.cl-ad small { display: block; color: var(--metin-3); font-size: var(--t-xs); }
.cl-ad.kod { font-family: var(--kod); font-size: 11.5px; }
.cl-iz { height: 14px; position: relative; background: linear-gradient(90deg, var(--yuzey-2), transparent); border-radius: 4px; }
.cl-cubuk { height: 100%; display: flex; gap: 2px; width: 0; min-width: 0; transition: width .95s var(--yay); }
.cl-cubuk > i { display: block; height: 100%; min-width: 0; transition: flex-grow .95s var(--yay), background .3s; }
.cl-cubuk > i:last-child { border-radius: 0 4px 4px 0; }
.cl-deger { font-size: 12px; color: var(--metin-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cl-deger b { color: var(--metin); font-weight: 600; }
.cl-deger .hata { color: var(--kritik-metin); margin-left: 6px; }
@media (max-width: 520px) { .cl-satir { grid-template-columns: minmax(0, 1fr) auto; } .cl-iz { grid-column: 1 / -1; grid-row: 2; height: 8px; } }

/* ---------- Sütun histogramı ---------- */
.sutunlar { display: flex; align-items: flex-end; gap: 6px; height: var(--yuk, 170px); padding-top: 18px; }
.sutun { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; outline-offset: 1px; border-radius: 6px; transition: background var(--hizli); }
.sutun:hover { background: var(--yuzey-2); }
.sutun .govde { width: 100%; max-width: 24px; background: var(--renk, var(--s1)); border-radius: 4px 4px 0 0; height: 0; transition: height .95s var(--yay), background .3s; }
.sutun .ust-deger { font-size: var(--t-xs); color: var(--metin-2); margin-bottom: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sutun-etiketler { display: flex; gap: 6px; margin-top: 6px; border-top: 1px solid var(--eksen); padding-top: 5px; }
.sutun-etiketler span { flex: 1; min-width: 0; text-align: center; font-size: var(--t-xs); color: var(--metin-3); line-height: 1.25; overflow-wrap: anywhere; }

/* ---------- Tablolar ---------- */
.tablo-kap { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
table.tablo { width: 100%; border-collapse: collapse; font-size: var(--t-s); }
.tablo th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--metin-2); padding: 8px; border-bottom: 1px solid var(--eksen); white-space: nowrap; background: var(--yuzey); position: sticky; top: 0; }
.tablo th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
.tablo th[aria-sort] button { color: var(--metin); }
.tablo th .ok { opacity: .7; font-size: 10px; }
.tablo td { padding: 8px; border-bottom: 1px solid var(--cizgi); vertical-align: top; overflow-wrap: anywhere; }
.tablo td.s, .tablo th.s { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablo tbody tr { transition: background var(--hizli); }
.tablo tbody tr:hover { background: color-mix(in srgb, var(--yuzey-2) 70%, transparent); }
.tablo tbody tr.tik { cursor: pointer; }
.tablo tbody tr.tik:hover, .tablo tbody tr.tik:focus-visible { background: var(--vurgu-zemin); outline: none; }
.tablo .baslik-h { font-weight: 550; color: var(--metin); max-width: 42ch; min-width: 170px; overflow-wrap: anywhere; }
.tablo .baslik-h small { display: block; font-weight: 400; color: var(--metin-3); font-size: 11.5px; }
.tablo .yol { min-width: 200px; display: inline-block; font-family: var(--kod); font-size: 11.5px; overflow-wrap: anywhere; }
.olcer { display: inline-block; width: 48px; height: 6px; border-radius: 3px; background: var(--yuzey-3); vertical-align: middle; margin-left: 6px; position: relative; overflow: hidden; }
.olcer i { position: absolute; inset: 0 auto 0 0; background: var(--vurgu); border-radius: 3px; }
.rozet { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: var(--r-hap); font-size: var(--t-xs); background: var(--yuzey-2); color: var(--metin-2); white-space: nowrap; }
.rozet.mac, .rozet.windows { border: 1px solid var(--cizgi); }
.rozet.zamanli { margin-left: 6px; background: var(--vurgu-zemin); color: var(--vurgu-metin); vertical-align: 1px; font-weight: 500; }
.model-nokta { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.daha { margin-top: 10px; }
.tablo-ust { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.tablo-ust .arama { width: min(340px, 100%); padding: 6px 10px; font-size: 13px; }

/* ---------- Rekorlar ---------- */
.rekorlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.rekor { position: relative; border: 1px solid var(--cizgi); border-radius: 12px; padding: 12px 14px; background: var(--yuzey-2); transition: transform .4s var(--yay), box-shadow var(--orta), border-color var(--orta), background var(--orta); min-width: 0; text-align: left; font: inherit; color: inherit; display: block; width: 100%; overflow: hidden; }
.rekor::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--vurgu); opacity: .7; }
button.rekor:hover { transform: translateY(-2px); box-shadow: var(--golge-kalk); border-color: var(--cizgi-guclu); background: var(--yuzey); }
.rekor .r-et { font-size: var(--t-xs); color: var(--metin-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; }
.rekor .r-de { font-size: 20px; font-weight: 680; margin-top: 3px; letter-spacing: -.02em; }
.rekor .r-ek { font-size: 12px; color: var(--metin-2); overflow-wrap: anywhere; }
.rekor .r-not { font-size: var(--t-xs); color: var(--metin-3); margin-top: 2px; }

/* ---------- İpucu: değer önde, ad arkada; çizgi anahtar ---------- */
.ipucu { max-height: min(70vh, 440px); overflow: hidden; position: fixed; z-index: 60; left: 0; top: 0; pointer-events: none; background: var(--ipucu-zemin); color: var(--metin); border: 1px solid var(--cizgi-guclu); border-radius: 12px; padding: 9px 12px 10px; font-size: var(--t-s); box-shadow: var(--golge-kalk); max-width: min(340px, calc(100vw - 24px)); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.ipucu .ip-b { font-weight: 600; font-size: 12px; color: var(--metin-2); margin-bottom: 5px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.ipucu .ip-s { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 8px; align-items: center; }
.ipucu .ip-s i { width: 12px; height: 2px; border-radius: 2px; display: inline-block; }
.ipucu .ip-s i.nokta { width: 8px; height: 8px; border-radius: 50%; }
.ipucu .ip-s i.nokta::after { display: none; }
.ipucu .ip-s b { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
.ipucu .ip-s span { color: var(--metin-2); overflow-wrap: anywhere; }
.ipucu .ip-n { color: var(--metin-2); margin-top: 6px; font-size: 12px; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 9.5em; overflow: hidden; }

/* ---------- SVG grafik ögeleri ---------- */
.ek-metin { fill: var(--metin-3); font-size: var(--t-xs); font-family: var(--yazi); }
.ek-metin.s { font-variant-numeric: tabular-nums; }
.izgara-c { stroke: var(--izgara); stroke-width: 1; shape-rendering: crispEdges; }
.eksen-c { stroke: var(--eksen); stroke-width: 1; shape-rendering: crispEdges; }
.artikil { stroke: var(--metin-3); stroke-width: 1; }
.hucre { transition: fill .6s ease, opacity .3s; }
.hucre.dalga { animation: hucre-gir .55s cubic-bezier(.2, .8, .3, 1.2) both; transform-box: fill-box; transform-origin: center; }
@keyframes hucre-gir { from { opacity: 0; transform: scale(.2); } }
.hucre:hover { stroke: var(--metin); stroke-width: 1.5; }
.kenar-cubuk { fill: var(--vurgu); opacity: .55; transition: opacity var(--hizli); }
.kenar-cubuk:hover { opacity: .9; }
.dilim { transition: opacity .2s; cursor: default; }
.soluk { opacity: .25; }
.etiket-dis { fill: var(--metin-2); font-size: 11.5px; }
.etiket-guclu { fill: var(--metin); font-size: 12px; font-weight: 650; }
.etiket-hale { paint-order: stroke; stroke: var(--yuzey); stroke-width: 3px; stroke-linejoin: round; }
.son-nokta { stroke: var(--yuzey); stroke-width: 2; }
.son-nokta.atar { animation: son-atar 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes son-atar { 0% { stroke-width: 2; } 30% { stroke-width: 7; stroke-opacity: .35; } 60%, 100% { stroke-width: 2; stroke-opacity: 1; } }

/* ---------- Oturum detayı ve replay ---------- */
.geri { display: inline-flex; align-items: center; gap: 6px; color: var(--vurgu-metin); text-decoration: none; font-size: 13px; padding: 4px 8px; margin-left: -8px; border-radius: 8px; }
.geri:hover { background: var(--vurgu-zemin); }
.detay-bas h2 { font-size: var(--t-xxl); letter-spacing: -.025em; overflow-wrap: anywhere; }
.detay-bas .cipler { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.replay { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
@media (max-width: 980px) { .replay { grid-template-columns: minmax(0, 1fr); } }
.replay-sahne { position: relative; min-width: 0; }
.replay-sahne canvas { width: 100%; display: block; touch-action: none; cursor: crosshair; border-radius: 8px; }
.replay-kontrol { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.oynat { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--vurgu); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 14px -4px var(--vurgu); transition: transform .3s var(--yay); flex: none; }
.oynat:hover { transform: scale(1.07); }
.oynat:active { transform: scale(.95); }
.oynat svg { width: 16px; height: 16px; fill: #fff; }
.replay-kontrol input[type="range"] { flex: 1 1 200px; min-width: 120px; accent-color: var(--vurgu); }
.replay-kontrol .zaman { font-family: var(--kod); font-size: 12px; color: var(--metin-2); min-width: 9ch; font-variant-numeric: tabular-nums; }
.replay-kontrol label { font-size: var(--t-s); color: var(--metin-2); display: inline-flex; gap: 6px; align-items: center; }
.simdi { border: 1px solid var(--cizgi); border-radius: 12px; padding: 12px; background: var(--yuzey-2); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.simdi .saat { font-family: var(--kod); font-size: 20px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.simdi .saat small { font-size: 12px; color: var(--metin-3); font-weight: 400; margin-left: 6px; }
.simdi .sayaclar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.simdi .sayaclar div { background: var(--yuzey); border-radius: 8px; padding: 6px 8px; border: 1px solid var(--cizgi); }
.simdi .sayaclar b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.simdi .sayaclar span { font-size: var(--t-xs); color: var(--metin-3); }
.simdi .son-istem { font-size: var(--t-s); background: var(--yuzey); border-radius: 8px; border: 1px solid var(--cizgi); padding: 8px 10px; max-height: 8.4em; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.simdi .son-istem.yeni { animation: vurgula .9s ease-out; }
@keyframes vurgula { from { background: var(--vurgu-zemin); } }
.simdi .etk { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--metin-3); font-weight: 600; }
.akis-listesi { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12px; min-height: 9em; }
.akis-listesi li { display: flex; align-items: baseline; gap: 7px; animation: kay .35s cubic-bezier(.2, .8, .3, 1) both; min-width: 0; }
.akis-listesi li i { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(1px); }
.akis-listesi li span { overflow-wrap: anywhere; min-width: 0; }
.akis-listesi li small { margin-left: auto; color: var(--metin-3); font-family: var(--kod); font-size: 10.5px; flex: none; }
@keyframes kay { from { opacity: 0; transform: translateX(-10px); } }
.istemler { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 560px; overflow: auto; }
.istemler li { border: 1px solid var(--cizgi); border-radius: 10px; padding: 8px 10px; background: var(--yuzey); min-width: 0; }
.istemler .i-ust { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--metin-3); font-family: var(--kod); }
.istemler .i-metin { font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; }
.bilgi-liste { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: var(--t-s); margin: 0; }
.bilgi-liste dt { color: var(--metin-3); }
.bilgi-liste dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- Ağaç haritası, kelime bulutu ---------- */
.agac { position: relative; width: 100%; }
.agac .ah-proje { position: absolute; border-radius: 8px; background: var(--yuzey-2); border: 1px solid var(--cizgi); overflow: hidden; }
.agac .ah-proje > span { position: absolute; left: 7px; top: 3px; font-size: 11.5px; font-weight: 650; color: var(--metin); white-space: nowrap; }
.agac .ah-dosya { position: absolute; border-radius: 4px; transition: background .5s, transform .3s var(--yay); animation: hucre-gir .6s cubic-bezier(.2, .8, .3, 1.15) both; overflow: hidden; }
.agac .ah-dosya:hover { transform: scale(1.03); z-index: 2; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.agac .ah-dosya span { position: absolute; left: 5px; top: 3px; right: 3px; font-family: var(--kod); font-size: 10.5px; line-height: 1.2; white-space: nowrap; }
.bulut text { transition: opacity .3s, fill .3s; cursor: default; }
.bulut text:hover { fill: var(--vurgu-metin); }

.uyari-kutu { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--vurgu-zemin); border: 1px solid var(--cizgi); font-size: var(--t-s); color: var(--metin-2); }
.uyari-kutu svg { flex: none; width: 16px; height: 16px; margin-top: 1px; color: var(--vurgu-metin); }
.durum { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.durum::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; transform: rotate(45deg); }
.durum.kritik { color: var(--kritik-metin); }

.alt-bilgi { padding-block: 12px 36px; font-size: 12px; color: var(--metin-3); display: flex; flex-wrap: wrap; gap: 6px 18px; border-top: 1px solid var(--cizgi); margin-top: 8px; }
.veri-yok { max-width: 560px; margin: 12vh auto; text-align: center; padding: 32px 24px; }
.veri-yok h2 { font-size: var(--t-xl); margin-bottom: 8px; }
.veri-yok p { color: var(--metin-2); }
.veri-yok code { display: inline-block; margin-top: 14px; padding: 8px 14px; border-radius: 9px; background: var(--yuzey-2); border: 1px solid var(--cizgi); font-size: 14px; }
.atla { position: absolute; left: 12px; top: -40px; z-index: 100; background: var(--yuzey); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--cizgi); }
.atla:focus { top: 8px; }
.bildirim { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--metin); color: var(--yuzey); padding: 8px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--golge-kalk); animation: bildirim 2.6s ease both; pointer-events: none; max-width: calc(100vw - 32px); }
@keyframes bildirim { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 6px); } }

/* ==========================================================================
   Canlı modülü (sunucu modu). Bütün sınıflar "cn-" önekli: geçmiş sekmeleriyle çakışmaz.
   Akışkan yerleşim: sabit yükseklik yok, sayfa tek kaydırır; yalnız olay günlüğü kendi içinde kayar.
   ========================================================================== */
.cn-bas-sag { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cn-kpiler { margin-bottom: 16px; }
.cn-kpiler .kpi .deger small { font-size: 13px; font-weight: 500; color: var(--metin-2); margin-left: 4px; letter-spacing: 0; }
.cn-hero { margin-bottom: 16px; }
.cn-hero .cn-simdi { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--metin-2); font-variant-numeric: tabular-nums; }
.cn-izgara { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-bottom: 8px; }
@media (min-width: 1100px) { .cn-izgara { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } .cn-yan { position: sticky; top: 76px; } }
.cn-bolum-bas { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.cn-bolum-bas h3 { font-size: 15px; }
.cn-lejant { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--metin-2); }
.cn-lejant span { display: inline-flex; align-items: center; gap: 6px; }

/* Orkestra: oturum grubu = oturum kartı + ajan kartları + SVG bağlar */
.cn-orkestra { display: flex; flex-direction: column; gap: 14px; }
.cn-grup { position: relative; background: color-mix(in srgb, var(--yuzey) 60%, transparent); border: 1px solid var(--cizgi); border-radius: 20px; padding: 14px; }
.cn-grup.cn-gir, .cn-ajan.cn-gir { animation: cn-gir 300ms var(--egri) both; }
.cn-grup.cn-cikiyor, .cn-ajan.cn-cikiyor { animation: cn-cik 260ms ease-in forwards; pointer-events: none; }
@keyframes cn-gir { from { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes cn-cik { to { opacity: 0; transform: scale(.94); } }
.cn-baglar { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.cn-bag-zemin { fill: none; stroke-width: 1.6; opacity: .4; }
.cn-bag-akis { fill: none; stroke-width: 2.2; stroke-dasharray: 2 10; stroke-linecap: round; animation: cn-akis 900ms linear infinite; }
.cn-bag.bitti .cn-bag-zemin { stroke: var(--eksen) !important; opacity: .8; stroke-dasharray: 2 4; }
.cn-bag.bitti .cn-bag-akis { display: none; }
.cn-bag.yeni .cn-bag-zemin { stroke-dasharray: 1; stroke-dashoffset: 1; animation: cn-ciz 420ms var(--egri) forwards; }
@keyframes cn-akis { from { stroke-dashoffset: 12; } to { stroke-dashoffset: 0; } }
@keyframes cn-ciz { to { stroke-dashoffset: 0; } }

.cn-kart { position: relative; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 14px; padding: 12px 14px; box-shadow: var(--golge), var(--isik); min-width: 0; transition: opacity 300ms, filter 300ms, box-shadow 300ms, border-color 300ms; overflow: hidden; }
.cn-kart::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--renk, var(--diger)); opacity: .85; }
.cn-kart.cn-oturum { width: min(100%, 640px); }
.cn-kart.cn-calisiyor { border-color: color-mix(in srgb, var(--renk, var(--vurgu)) 40%, var(--cizgi)); }
.cn-kart.cn-nabiz { animation: cn-nabiz 650ms ease-out; }
@keyframes cn-nabiz { 0% { box-shadow: 0 0 0 0 var(--vurgu-zemin), var(--golge); border-color: var(--vurgu); } 100% { box-shadow: 0 0 0 12px transparent, var(--golge); } }
.cn-k-ust { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; color: var(--metin-3); }
.cn-k-ust .cn-proje { font-weight: 650; color: var(--metin-2); text-transform: uppercase; letter-spacing: .06em; font-size: var(--t-xs); white-space: nowrap; }
.cn-k-ust .cn-dal { font-family: var(--kod); font-size: var(--t-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cn-k-ust .cn-bosluk { flex: 1; }
.cn-kart h4 { font-size: 15px; line-height: 1.3; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cn-ajan h4 { font-size: 13.5px; }
.cn-rozetler { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.cn-rozet { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: var(--r-hap); background: var(--yuzey-2); font-size: 11.5px; color: var(--metin-2); white-space: nowrap; }
.cn-rozet > i { width: 8px; height: 8px; border-radius: 50%; background: var(--renk, var(--diger)); flex: none; }
.cn-durum { font-weight: 600; color: var(--metin); }
.d-aktif .nokta, .d-calisiyor .nokta { background: var(--iyi); }
.d-aktif .nokta::after, .d-calisiyor .nokta::after { animation: nabiz-halka 1.6s ease-out infinite; }
.d-bekliyor .nokta { background: var(--uyari); }
.d-bosta .nokta { background: var(--metin-3); }
.d-kapandi .nokta, .d-bitti .nokta { background: var(--diger); }

/* Bağlam ölçeri: dolgu = ciddiyet, iz aynı rampanın açık basamağı; sayı çubuğun içinde */
.cn-olcer { position: relative; height: 18px; border-radius: 6px; background: var(--vurgu-zemin); overflow: hidden; margin-top: 9px; }
.cn-olcer .cn-dolgu { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--vurgu) 45%, transparent), var(--vurgu)); opacity: .6; border-radius: 6px; transition: width 450ms var(--egri), background 300ms; }
.cn-olcer.uyari .cn-dolgu { background: var(--uyari); }
.cn-olcer.kritik .cn-dolgu { background: var(--kritik); }
.cn-olcer .cn-om { position: relative; z-index: 1; display: block; padding-inline: 7px; font-size: var(--t-xs); line-height: 18px; color: var(--metin); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cn-ajan .cn-olcer { height: 15px; margin-top: 7px; }
.cn-ajan .cn-olcer .cn-om { line-height: 15px; font-size: 10.5px; }
.cn-arac { display: flex; align-items: baseline; gap: 7px; margin-top: 8px; font-size: var(--t-s); min-width: 0; color: var(--metin-2); }
.cn-arac .cn-ad { flex: none; font-family: var(--kod); font-size: 11.5px; color: var(--metin); background: var(--yuzey-2); border-radius: 5px; padding: 0 6px; }
.cn-arac .cn-oz { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cn-k-alt { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 9px; }
.cn-sayilar { font-size: 12px; color: var(--metin-3); line-height: 1.45; min-width: 0; font-variant-numeric: tabular-nums; }
.cn-sayilar b { color: var(--metin); font-weight: 680; font-size: 15px; }
.cn-ajan .cn-sayilar b { font-size: 13.5px; }
.cn-kivilcim { flex: none; display: block; overflow: visible; }
.cn-kivilcim .bos { stroke: var(--eksen); stroke-width: 1; stroke-dasharray: 2 3; }
.cn-ajanlar { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; margin-top: 30px; }
.cn-ajanlar:empty { display: none; }
.cn-ajan.bitti { opacity: .58; filter: saturate(.35); }
.cn-ajan.bitti:hover { opacity: .9; filter: none; }
.cn-ozet-cip { margin-top: 10px; font-size: 12px; color: var(--metin-3); }
.cn-bos { border: 1px dashed var(--eksen); border-radius: 16px; padding: 32px 18px; text-align: center; color: var(--metin-2); background: color-mix(in srgb, var(--yuzey) 50%, transparent); }
.cn-bos p + p { margin-top: 6px; font-size: var(--t-s); color: var(--metin-3); }
.cn-bos .dugme { margin-top: 12px; }

/* Yan sütun */
.cn-yan { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cn-panel { padding: 14px 16px; }
.cn-panel h3 { font-size: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.cn-panel h3 small { font-size: 11.5px; font-weight: 500; color: var(--metin-3); }
.cn-yigin { display: flex; gap: 2px; height: 12px; border-radius: 4px; overflow: hidden; background: var(--yuzey-2); }
.cn-yigin span { display: block; height: 100%; min-width: 3px; transition: flex-grow 450ms var(--egri); background: var(--renk); }
.cn-model-liste { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: var(--t-s); }
.cn-model-liste li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.cn-model-liste i { width: 10px; height: 10px; border-radius: 3px; background: var(--renk); }
.cn-model-liste .cn-ad { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cn-model-liste .cn-tk { color: var(--metin-2); font-variant-numeric: tabular-nums; }
.cn-model-liste .cn-ml { color: var(--metin-3); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.cn-bos-not { font-size: var(--t-s); color: var(--metin-3); }
.cn-akis { list-style: none; margin: 0; padding: 0; max-height: min(58vh, 620px); overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; overscroll-behavior: contain; }
@media (max-width: 1099px) { .cn-akis { max-height: 420px; } }
.cn-akis li { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 2px 8px; padding: 6px 4px; border-bottom: 1px solid var(--cizgi); font-size: 12px; align-items: baseline; cursor: pointer; border-radius: 6px; transition: background var(--hizli); }
.cn-akis li:hover { background: var(--yuzey-2); }
.cn-akis li:last-child { border-bottom: 0; }
.cn-akis li.yeni { animation: cn-kay 280ms var(--egri) both; }
@keyframes cn-kay { from { opacity: 0; transform: translateY(-8px); background: var(--vurgu-zemin); } }
.cn-akis .cn-zm { color: var(--metin-3); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.cn-akis .cn-kim { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--metin); display: flex; align-items: center; gap: 6px; min-width: 0; }
.cn-akis .cn-kim i { width: 7px; height: 7px; border-radius: 50%; background: var(--renk, var(--diger)); flex: none; }
.cn-akis .cn-kim i.kare { border-radius: 2px; }
.cn-akis .cn-kim span { overflow: hidden; text-overflow: ellipsis; }
.cn-akis .cn-tk { color: var(--metin-3); font-variant-numeric: tabular-nums; font-size: 11.5px; text-align: right; }
.cn-akis .cn-ne { grid-column: 2 / 4; color: var(--metin-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cn-akis .cn-ne code { font-family: var(--kod); font-size: var(--t-xs); color: var(--metin); background: var(--yuzey-2); border-radius: 4px; padding: 0 5px; margin-right: 5px; }
.cn-alt-not { font-size: 11.5px; color: var(--metin-3); margin-top: 12px; }

/* ==========================================================================
   Faz B2: Projeler, Oturumlar, ayrıntı/replay, Akışlar, Ajanlar, Alışkanlıklar, Dosyalar
   ========================================================================== */
/* ---------- Proje kartları ---------- */
.pk-ust-arac { margin: 4px 0 12px; justify-content: flex-end; }
.projeler { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.pk { text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 12px; width: 100%; overflow: hidden; }
button.pk { cursor: pointer; }
.pk > span { display: block; min-width: 0; }
.pk .pk-ust { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pk .pk-sira { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: var(--t-xs); font-weight: 650; color: var(--metin-2); background: var(--yuzey-2); border: 1px solid var(--cizgi); font-variant-numeric: tabular-nums; }
.pk .pk-ad { font-size: 14px; font-weight: 650; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pk .pk-wt { flex: none; background: var(--vurgu-zemin); color: var(--vurgu-metin); }
.pk .pk-mal { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pk .pk-mal > span { font-size: 24px; font-weight: 680; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.pk .pk-mal small { font-size: var(--t-xs); color: var(--metin-3); font-variant-numeric: tabular-nums; }
.pk .pk-pay { height: 4px; border-radius: 2px; background: var(--yuzey-3); overflow: hidden; margin-top: -4px; }
.pk .pk-pay i, .pk .pk-om i { display: block; height: 100%; background: var(--vurgu); border-radius: inherit; width: 0; transition: width 1s var(--yay); }
.pk .pk-olcu { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 8px 0; border-block: 1px solid var(--cizgi); }
.pk .pk-olcu > span { display: flex; flex-direction: column; min-width: 0; }
.pk .pk-olcu small, .pk .pk-cs small { font-size: 10.5px; color: var(--metin-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.pk .pk-olcu b { font-size: 13.5px; font-weight: 620; font-variant-numeric: tabular-nums; }
.pk .pk-cift { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pk .pk-cs { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pk .pk-cs small i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.pk .pk-cs b { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.pk .pk-om { display: block; height: 4px; border-radius: 2px; background: var(--yuzey-3); overflow: hidden; }
.pk .pk-cs:first-child .pk-om i { background: var(--s7); }
.pk .pk-cs:last-child .pk-om i { background: var(--s3); }
.pk svg.pk-kiv { width: calc(100% + 32px); margin: 0 -16px; height: 34px; display: block; }
.pk .pk-alt { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--metin-3); }
.pk .pk-alt .nokta { width: 7px; height: 7px; }
.pk-not { margin-top: 0; flex-direction: row; }
.pk-not > div { display: grid; gap: 4px; min-width: 0; }
.pk-not b { color: var(--metin); font-weight: 600; }

/* ---------- Kelebek (çift yönlü çubuk) ---------- */
.kb { display: grid; gap: 3px; }
.kb-bas, .kb-satir { display: grid; grid-template-columns: minmax(0, 1fr) minmax(96px, 30%) minmax(0, 1fr); align-items: center; gap: 10px; }
.kb-bas { font-size: var(--t-xs); color: var(--metin-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 0 6px 6px; border-bottom: 1px solid var(--cizgi); margin-bottom: 4px; }
.kb-bas span { display: flex; align-items: center; gap: 6px; }
.kb-bas .kb-sag { justify-content: flex-end; }
.kb-bas i { width: 9px; height: 9px; border-radius: 3px; }
.kb-satir { padding: 4px 6px; border-radius: 8px; transition: background var(--hizli); }
.kb-satir:hover, .kb-satir:focus-visible { background: var(--yuzey-2); }
.kb-satir[data-tik] { cursor: pointer; }
.kb-yan { display: flex; align-items: center; gap: 8px; min-width: 0; }
.kb-yan b { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 6ch; }
.kb-sol b { text-align: left; }
.kb-sag b { text-align: right; }
.kb-iz { flex: 1; height: 12px; display: flex; min-width: 0; }
.kb-sol .kb-iz { justify-content: flex-end; }
.kb-iz i { display: block; height: 100%; width: 0; transition: width .95s var(--yay); }
.kb-sol .kb-iz i { border-radius: 4px 0 0 4px; }
.kb-sag .kb-iz i { border-radius: 0 4px 4px 0; }
.kb-ad { text-align: center; min-width: 0; line-height: 1.25; }
.kb-ad span { display: block; font-size: var(--t-s); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb-ad small { display: block; font-size: 10.5px; color: var(--metin-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 560px) {
  .kb-bas, .kb-satir { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 8px; }
  .kb-bas > span:nth-child(2) { display: none; }
  .kb-ad { grid-column: 1 / -1; grid-row: 1; text-align: left; }
  .kb-iz { height: 8px; }
}

/* ---------- Dağılım ---------- */
svg.dagilim .dg-nokta { fill-opacity: .5; stroke-opacity: 0; stroke-width: 1.5; transition: fill-opacity var(--hizli), stroke-opacity var(--hizli); }
svg.dagilim .dg-nokta.balon { fill-opacity: .22; stroke-opacity: 1; stroke-width: 2; }
svg.dagilim .dg-nokta.vurgu, svg.dagilim .dg-nokta:focus-visible { fill-opacity: .9; stroke: var(--metin) !important; stroke-opacity: 1; stroke-width: 2; outline: none; }

/* ---------- Yüzde şeridi ---------- */
.ys { display: flex; gap: 2px; height: 26px; border-radius: 8px; overflow: hidden; background: var(--yuzey-2); }
.ys-p { display: flex; align-items: center; justify-content: center; min-width: 3px; flex-basis: 0; flex-grow: 0; transition: flex-grow 1s var(--yay), filter var(--hizli); overflow: hidden; }
.ys-p:hover, .ys-p:focus-visible { filter: brightness(1.12) saturate(1.1); outline-offset: -2px; }
.ys-p small { font-size: 10.5px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ys-lejant { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 4px; font-size: var(--t-s); }
.ys-lejant li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 7px; }
.ys-lejant li:hover { background: var(--yuzey-2); }
.ys-lejant i { width: 10px; height: 10px; border-radius: 3px; }
.ys-lejant span { font-family: var(--kod); font-size: 11.5px; overflow-wrap: anywhere; }
.ys-lejant b { font-weight: 620; font-variant-numeric: tabular-nums; }
.ys-lejant small { color: var(--metin-3); font-variant-numeric: tabular-nums; min-width: 6ch; text-align: right; }
.kat-rol { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--cizgi); }
.kat-rol .ys { height: 18px; }
.kat-rol .ys-lejant { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* ---------- Oturum tablosu ---------- */
.oturum-tablo .baslik-h .bh-ad { display: block; }
.oturum-tablo .rozetler { display: flex; flex-wrap: wrap; gap: 4px; margin: 3px 0 1px; }
.rozet.kucuk { padding: 0 6px; font-size: 10.5px; line-height: 1.6; }
.rozet.hata { background: color-mix(in srgb, var(--kritik) 14%, transparent); color: var(--kritik-metin); }
.rozet.uyari { background: color-mix(in srgb, var(--uyari) 18%, transparent); color: var(--uyari-metin); }
.rozet.sik { background: var(--yuzey-3); color: var(--metin-2); }
.oturum-tablo .rozet.zamanli { margin-left: 0; }
.oturum-tablo .proje-h { font-size: 12px; color: var(--metin-2); white-space: nowrap; }
.oturum-tablo .zaman-h small { display: block; font-size: 10.5px; color: var(--metin-3); }
.oturum-tablo td.s .olcer { display: block; width: 100%; max-width: 72px; margin: 4px 0 0 auto; height: 4px; }
.tablo.yogun td { padding: 4px 8px; }
.tablo.yogun .baslik-h small, .tablo.yogun .zaman-h small { display: none; }
.tablo.yogun .rozetler { display: inline-flex; margin: 0 0 0 6px; vertical-align: 1px; }
.tablo.yogun .baslik-h .bh-ad { display: inline; }
.tablo.yogun td.s .olcer { margin-top: 2px; }
@media (max-width: 720px) { .oturum-tablo .dar-gizle { display: none; } }

/* ---------- Oturum ayrıntısı + replay (yeni dil) ---------- */
.detay-bas { padding-bottom: 4px; }
.detay-bas .cip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.replay { gap: 18px; }
.replay-sahne canvas { border: 1px solid var(--cizgi); background: var(--yuzey); }
.replay-kontrol { background: var(--yuzey-2); border: 1px solid var(--cizgi); border-radius: var(--r-hap); padding: 6px 14px 6px 6px; gap: 12px; }
.replay-kontrol select { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: var(--r-s); padding: 3px 6px; font-size: var(--t-s); }
.oynat { background: linear-gradient(160deg, color-mix(in srgb, var(--vurgu) 82%, #fff) 0%, var(--vurgu) 60%); box-shadow: 0 6px 16px -6px var(--vurgu), inset 0 1px 0 rgba(255, 255, 255, .35); }
.oynat:focus-visible { outline-offset: 3px; border-radius: 50%; }
.replay-kontrol input[type="range"] { height: 20px; }
.simdi { background: var(--yuzey); box-shadow: var(--golge), var(--isik); border-radius: var(--r-m); padding: 14px; }
.simdi .sayaclar div { background: var(--yuzey-2); }
.simdi .son-istem { background: var(--yuzey-2); }
.istemler li { transition: border-color var(--hizli), background var(--hizli); }
.istemler li:hover, .istemler li:focus-visible { border-color: var(--cizgi-guclu); background: var(--yuzey-2); }
.bilgi-liste dd.kod { font-size: 11.5px; }
@media (max-width: 520px) { .replay-kontrol { border-radius: var(--r-m); padding: 8px; } .bilgi-liste { grid-template-columns: minmax(0, 1fr); gap: 2px; } .bilgi-liste dd { margin-bottom: 6px; } }
@media (prefers-reduced-motion: reduce) {
  .aurora i { animation: none !important; }
  .gir, .bolum.aktif, .hucre.dalga, .akis-listesi li, .agac .ah-dosya, .acilir-panel, .simdi .son-istem.yeni, .son-nokta.atar { animation: none !important; }
  .cl-cubuk, .cl-cubuk > i, .sutun .govde, .pk .pk-pay i, .pk .pk-om i, .kb-iz i, .ys-p, .sekme-cizgi, .kart, .rekor, main { transition: none !important; }
  .kart.kalkar:hover, button.rekor:hover { transform: none; }
  .nokta::after { animation: none !important; }
  .cn-grup, .cn-ajan, .cn-kart, .cn-akis li, .cn-bag .cn-bag-zemin, .dugme.donuyor svg { animation: none !important; }
  .cn-bag-akis { display: none; }
  .cn-olcer .cn-dolgu, .cn-yigin span { transition: none !important; }
}
@media (forced-colors: active) {
  .cl-cubuk > i, .sutun .govde { forced-color-adjust: none; }
}
</style>
</head>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

          <rect x="7" y="19" width="5" height="6" rx="1.5" style="fill:var(--s1)"/>
          <rect x="14.5" y="14" width="5" height="11" rx="1.5" style="fill:var(--s3)"/>
          <rect x="22" y="9.5" width="5" height="15.5" rx="1.5" style="fill:var(--s2)"/>
        </svg>
      </span>
      <div>
        <h1>Pano</h1>
        <p id="ust-alt">Claude Code geçmişi</p>
      </div>

      <span id="kaynak-cipler" class="ust-sag"></span>

      <button class="dugme" type="button" id="yenile-dugme" hidden title="Geçmişi sunucuda yeniden hesapla ve yükle">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/></svg>

    try { if (tema === "sistem") localStorage.removeItem("pano-tema"); else localStorage.setItem("pano-tema", tema); } catch (e) { /* depolama yok */ }
    temaUygula(false);
  });
  if (window.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); const f = () => { if (tema === "sistem") temaYenile(); }; if (mq.addEventListener) mq.addEventListener("change", f); }
  // claude.ai Artifact'ı tema seçimini köke data-theme olarak yazar; dışarıdan değişirse grafikleri de yeniden boya.
  if (window.MutationObserver) new MutationObserver(() => {
    const a = doc.documentElement.getAttribute("data-theme"), y = a === "light" || a === "dark" ? a : "sistem";
    if (y !== tema) { tema = y; temaUygula(false); }
  }).observe(doc.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // ---------- Açılış ----------
  function veriYok(baslik, metin) {
    $(".sekmeler-kap").hidden = true; $("#filtre-kap").hidden = true;
    bosalt(main).appendChild(h("div", { class: "kart veri-yok" }, h("h2", { text: baslik }), h("p", { text: metin }), h("code", { text: "node pano.mjs" })));
  }
  temaUygula(true);
  $("#atla").addEventListener("click", () => main.focus());
  addEventListener("scroll", () => $("#filtre-kap").classList.toggle("yapisti", scrollY > 120), { passive: true });
  // Genişlik değişince etkin bölümü yeniden çiz
  let sonGen = main.clientWidth, rz = 0;
  addEventListener("resize", () => {
    clearTimeout(rz);
    rz = setTimeout(() => { cizgiTasi(); const w = main.clientWidth; if (Math.abs(w - sonGen) > 24) { sonGen = w; surum++; onb.clear(); if (aktifId === "oturum") rota(); else if (aktifId) bolumCiz(aktifId); } }, 220);
  });
  let V = null;
  const t0 = performance.now();
  // Sunucu modu: geçmişi /pano.json'dan (sayfa sorgusuyla) alır. Yenilemede etkin sekme, filtre ve kaydırma korunur;
  // veri gelene kadar önceki çizim soluk kalır (yerleşim zıplamaz). o.taze: sunucu hemen yeniden hesaplasın.
  let yukleniyor = null, sonYukleme = 0;
  function gecmisYukle(o) {
    if (yukleniyor) return yukleniyor;
    sonYukleme = Date.now();
    const yd = $("#yenile-dugme"), ilk = !D;
    yd.disabled = true; yd.classList.add("donuyor");
    if (!ilk) main.classList.add("yenileniyor");
    const url = "/pano.json" + (o.taze ? (location.search ? location.search + "&" : "?") + "taze=1" : location.search);
    yukleniyor = fetch(url, { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : r.json().catch(() => ({})).then((j) => { throw new Error(j.hata || "HTTP " + r.status); })))
      .then((v) => {
        if (!ilk && !o.taze && v && v.meta && D.meta && v.meta.uretildi === D.meta.uretildi) return;   // değişmemiş
        if (o.sessiz && aktifId === "oturum") return;   // yanıt beklerken oturum ayrıntısına geçildiyse D'yi değiştirme (ayrıntı yeniden çizilmez, sözlük indeksleri kayardı)
        const tAyr = performance.now() - t0;
        const eski = ilk ? null : filtreAdlari();
        const hata = veriKur(v);
        if (hata) { D = null; veriHata = hata; $("#ust-alt").textContent = "Claude Code · canlı · geçmiş yok"; }
        else {
          veriHata = null;
          if (eski) filtreAdlariUygula(eski);
          filtreKur(); F = filtreHesapla(); G = H.gorunum(D, F); surum++; onb.clear();
        }
        if (aktifId === "oturum") { if (ilk || o.taze) rota(); }
        else if (aktifId && (ilk || aktifId !== "canli")) goster(aktifId);
        if (!hata && ilk) console.info(`Pano: ${D.nS} oturum, ${D.nA} ajan, ${D.nK} kova; veri ${tAyr.toFixed(0)} ms (sunucudan)`);
        if (!hata && !ilk && o.taze) bildirim("Geçmiş güncellendi · " + dfSaat.format(Date.now()));
      })
      .catch((e) => {
        console.error("Pano: geçmiş verisi alınamadı", e);
        if (D) { bildirim("Geçmiş yenilenemedi: " + ((e && e.message) || e)); return; }
        veriHata = "Sunucudan geçmiş verisi alınamadı: " + ((e && e.message) || e) + ". Yenile düğmesini deneyin ya da sunucu günlüğüne bakın (out/sunucu.log).";
        $("#ust-alt").textContent = "Claude Code · canlı · geçmiş alınamadı";
        for (const k in durum) if (durum[k].bekleme) gecmisBekleniyor(durum[k].el);
        if (aktifId === "oturum") gecmisBekleniyor(durum.oturum.el);
      })
      .finally(() => { yukleniyor = null; yd.disabled = false; yd.classList.remove("donuyor"); main.classList.remove("yenileniyor"); });
    return yukleniyor;
  }
  // Sunucu modu: sekmeler hemen kurulur (Canlı veri beklemez), geçmiş arkadan /pano.json'dan gelir.
  // Sorgu (?since=…&until=…&kaynak=…&metinsiz=1) olduğu gibi sunucuya geçer.
  if (SUNUCU) {
    $("#ust-alt").textContent = "Claude Code · canlı · geçmiş yükleniyor…";
    sekmeKur();
    addEventListener("hashchange", rota);
    rota();
    canli.baslat();
    const yd = $("#yenile-dugme");
    yd.hidden = false;
    yd.addEventListener("click", () => gecmisYukle({ taze: true }));
    // Sekmeye ya da pencereye dönünce arkadan tazele (en çok dakikada bir; oturum ayrıntısındayken bekler)
    const donus = () => { if (!doc.hidden && D && Date.now() - sonYukleme > 60000 && aktifId !== "oturum") gecmisYukle({ sessiz: true }); };
    doc.addEventListener("visibilitychange", donus);
    addEventListener("focus", donus);
    gecmisYukle({});
    return;
  }
  try {
    const el = $("#pano-veri"), ham = el ? el.textContent.trim() : "";
    if (!ham || ham === "__PANO" + "_VERI__") { veriYok("Veri yok", "Bu şablon henüz doldurulmadı. Panoyu üretmek için orchestration-report klasöründe şunu çalıştırın:"); return; }
    V = JSON.parse(ham);
  } catch (e) { veriYok("Veri okunamadı", "Gömülü JSON ayrıştırılamadı (" + (e && e.message) + "). Panoyu yeniden üretin:"); return; }
  const tAyr = performance.now() - t0;
  const kurHata = veriKur(V);
  if (kurHata) { veriYok("Veri yok", kurHata + " Kaynak klasörlerini kontrol edip yeniden üretin:"); return; }
  sekmeKur();
  filtreKur();
  F = filtreHesapla(); G = H.gorunum(D, F); surum++;
  addEventListener("hashchange", rota);
  rota();
  console.info(`Pano: ${D.nS} oturum, ${D.nA} ajan, ${D.nK} kova; JSON ayrıştırma ${tAyr.toFixed(0)} ms, ilk çizim dahil toplam ${(performance.now() - t0).toFixed(0)} ms`);

  // Veriyi hazırlar, üst bilgi ve alt bilgiyi doldurur. Dönüş: sorun varsa açıklama, yoksa null.
  function veriKur(V) {
    D = H.hazirla(V);
    modelSlotKur(D.M);
    const idSay = new Map(); for (const o of D.S) idSay.set(String(o.id), (idSay.get(String(o.id)) || 0) + 1);
    D._ciftId = new Set([...idSay].filter((x) => x[1] > 1).map((x) => x[0]));
    if (!D.nS && !D.nK) return "Pano üretildi ama içinde oturum yok.";
    // Üst bilgi
    $("#ust-alt").textContent = `Claude Code geçmişi · ${new Date(D.ilkMs).getFullYear() === new Date(D.sonMs).getFullYear() ? dfGun.format(D.ilkMs) + " – " + dfGunYil.format(D.sonMs) : dfGunYil.format(D.ilkMs) + " – " + dfGunYil.format(D.sonMs)} · ${fSayi(D.nS)} oturum`;
    const kc = bosalt($("#kaynak-cipler"));
    for (const k of Array.isArray(D.meta.kaynaklar) ? D.meta.kaynaklar : []) kc.appendChild(h("span", { class: "cip", title: String(k.ad) + (k.kok ? " · " + String(k.kok) : "") }, h("i"), h("b", { text: String(k.ad) }), (k.dosya != null ? fSayi(k.dosya) + " dosya" : "")));
    const sn = $("#suzgec-not"); if (sn) sn.remove();
    const mf = D.meta.filtre;
    if (mf && typeof mf === "object" && (mf.since || mf.until || mf.kaynak || mf.metinsiz)) {
      const p = [mf.since ? "başlangıç " + mf.since : null, mf.until ? "bitiş " + mf.until : null, mf.kaynak ? "yalnız " + mf.kaynak + " kaynağı" : null, mf.metinsiz ? "metinsiz (istem metinleri yok)" : null].filter(Boolean);
      $(".ust-ic").after(h("div", { class: "kap", id: "suzgec-not", style: "margin-top:10px" }, h("div", { class: "uyari-kutu", role: "note" }, h("span", null, h("b", { text: "Bu pano süzgeçle üretildi: " }), p.join(" · ") + ". Kapsam dışındaki kayıtlar burada yok."))));
    }
    const alt = bosalt($("#alt-bilgi"));
    ekle(alt, [
      h("span", { text: "Üretildi: " + (D.meta.uretildi ? dfTam.format(D.meta.uretildi) : "?") + (D.meta.sureMs ? " · toplama " + fSure(D.meta.sureMs / 1000) : "") }),
      h("span", { text: String(D.meta.fiyatNotu || "") }),
      V.ozet ? h("span", { text: `Doğrulama: ${fSayi(V.ozet.cagri)} çağrı · ${fPara(V.ozet.maliyet)} · ${fSayi(V.ozet.oturum)} oturum · ${fSayi(V.ozet.ajan)} ajan` }) : null,
      D.meta.metinler === false ? h("span", { text: "Metinsiz üretildi: istem metinleri gizli." }) : null,
      h("span", { text: "Saatler bu tarayıcının saat diliminde (" + (Intl.DateTimeFormat().resolvedOptions().timeZone || "yerel") + ")." }),
    ]);
    return null;
  }
})();
